[package]
name = "rastray-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"

[[bin]]
name = "toml_config"
path = "fuzz_targets/toml_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "suppression_directive"
path = "fuzz_targets/suppression_directive.rs"
test = false
doc = false
bench = false
