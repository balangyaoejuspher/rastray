name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish in dry-run mode without uploading."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rastray-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(grep -m 1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Git tag v$TAG does not match Cargo.toml version $MANIFEST"
            exit 1
          fi

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features --locked

      - name: cargo package
        run: cargo package --locked

  binaries:
    name: Build ${{ matrix.target }}
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rastray-bin-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="rastray-v${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/rastray" "dist/${NAME}/"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "dist/${NAME}/"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: Stage artifact (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $name = "rastray-v$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rastray.exe" "dist/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, CHANGELOG.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "dist/$name.zip.sha256" -Encoding ascii

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign archive with cosign (keyless)
        env:
          COSIGN_YES: "true"
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="rastray-v${VERSION}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            ARCHIVE="dist/${NAME}.zip"
          else
            ARCHIVE="dist/${NAME}.tar.gz"
          fi
          cosign sign-blob \
            --bundle "${ARCHIVE}.cosign.bundle" \
            "${ARCHIVE}"
          jq -r '.messageSignature.signature' "${ARCHIVE}.cosign.bundle" \
            > "${ARCHIVE}.sig"
          {
            printf -- '-----BEGIN CERTIFICATE-----\n'
            jq -r '.verificationMaterial.certificate.rawBytes' \
              "${ARCHIVE}.cosign.bundle" | fold -w 64
            printf -- '-----END CERTIFICATE-----\n'
          } > "${ARCHIVE}.crt"

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/rastray-*.tar.gz
            dist/rastray-*.zip

      - name: Extract release notes from annotated tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # Strip the first line (subject) + blank line; keep the body
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > release_notes.md
          if [ ! -s release_notes.md ]; then
            # Fallback: use full tag message if body is empty (lightweight tag)
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release_notes.md
          fi
          echo '--- release_notes.md ---'
          cat release_notes.md

      - name: Upload artifacts to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body_path: release_notes.md
          files: |
            dist/rastray-*.tar.gz
            dist/rastray-*.tar.gz.sha256
            dist/rastray-*.tar.gz.sig
            dist/rastray-*.tar.gz.crt
            dist/rastray-*.tar.gz.cosign.bundle
            dist/rastray-*.zip
            dist/rastray-*.zip.sha256
            dist/rastray-*.zip.sig
            dist/rastray-*.zip.crt
            dist/rastray-*.zip.cosign.bundle
          fail_on_unmatched_files: false

  installers:
    name: Publish installer scripts
    needs: binaries
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Upload installers to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            install/install.sh
            install/install.ps1
          fail_on_unmatched_files: true

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == false }}
    environment: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  dist-bump:
    name: Bump Homebrew tap and Scoop bucket
    needs: installers
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version and tarball SHAs
        id: shas
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          base="https://github.com/balangyaoejuspher/rastray/releases/download/${TAG}"
          for asset_id in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
              sha=$(curl -fsSL "${base}/rastray-${TAG}-${asset_id}.tar.gz.sha256" | awk '{print $1}')
              echo "${asset_id}=${sha}" >> "$GITHUB_OUTPUT"
          done
          win_sha=$(curl -fsSL "${base}/rastray-${TAG}-x86_64-pc-windows-msvc.zip.sha256" | awk '{print $1}')
          echo "x86_64-pc-windows-msvc=${win_sha}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap (balangyaoejuspher/homebrew-rastray)
        env:
          GH_TOKEN: ${{ secrets.DIST_REPOS_TOKEN }}
          VERSION: ${{ steps.shas.outputs.version }}
          ARM64_DARWIN: ${{ steps.shas.outputs['aarch64-apple-darwin'] }}
          X64_DARWIN: ${{ steps.shas.outputs['x86_64-apple-darwin'] }}
          X64_LINUX: ${{ steps.shas.outputs['x86_64-unknown-linux-gnu'] }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
              echo "::warning::DIST_REPOS_TOKEN secret not set; skipping Homebrew tap bump"
              exit 0
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/balangyaoejuspher/homebrew-rastray.git" tap
          cd tap
          cat > Formula/rastray.rb <<EOF
          class Rastray < Formula
            desc "Blazing-fast static analysis for security, dependencies, and performance"
            homepage "https://github.com/balangyaoejuspher/rastray"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "https://github.com/balangyaoejuspher/rastray/releases/download/v#{version}/rastray-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM64_DARWIN}"
              end
              on_intel do
                url "https://github.com/balangyaoejuspher/rastray/releases/download/v#{version}/rastray-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${X64_DARWIN}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/balangyaoejuspher/rastray/releases/download/v#{version}/rastray-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${X64_LINUX}"
              end
            end

            def install
              bin.install "rastray"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/rastray --version")
              (testpath/"sample.py").write <<~PY
                import os
                os.system("echo hello")
              PY
              system "#{bin}/rastray", testpath.to_s, "--fail-on", "never"
            end
          end
          EOF
          if git diff --quiet; then
              echo "Formula already up to date"
              exit 0
          fi
          git -c user.name="rastray-release-bot" -c user.email="balangyao.e.juspher+rastray-release-bot@users.noreply.github.com" \
              commit -am "chore: bump rastray to ${VERSION}"
          git push origin main

      - name: Update Scoop bucket (balangyaoejuspher/scoop-rastray)
        env:
          GH_TOKEN: ${{ secrets.DIST_REPOS_TOKEN }}
          VERSION: ${{ steps.shas.outputs.version }}
          WIN_HASH: ${{ steps.shas.outputs['x86_64-pc-windows-msvc'] }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
              echo "::warning::DIST_REPOS_TOKEN secret not set; skipping Scoop bucket bump"
              exit 0
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/balangyaoejuspher/scoop-rastray.git" bucket
          cd bucket
          cat > bucket/rastray.json <<EOF
          {
              "version": "${VERSION}",
              "description": "Blazing-fast static analysis CLI for security, dependency, and performance audits.",
              "homepage": "https://github.com/balangyaoejuspher/rastray",
              "license": "MIT OR Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/balangyaoejuspher/rastray/releases/download/v${VERSION}/rastray-v${VERSION}-x86_64-pc-windows-msvc.zip",
                      "hash": "${WIN_HASH}",
                      "bin": "rastray.exe"
                  }
              },
              "checkver": {
                  "github": "https://github.com/balangyaoejuspher/rastray"
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/balangyaoejuspher/rastray/releases/download/v\$version/rastray-v\$version-x86_64-pc-windows-msvc.zip",
                          "hash": {
                              "url": "\$url.sha256"
                          }
                      }
                  }
              }
          }
          EOF
          if git diff --quiet; then
              echo "Manifest already up to date"
              exit 0
          fi
          git -c user.name="rastray-release-bot" -c user.email="balangyao.e.juspher+rastray-release-bot@users.noreply.github.com" \
              commit -am "chore: bump rastray to ${VERSION}"
          git push origin main
